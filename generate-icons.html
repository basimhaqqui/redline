<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
</head>
<body>
  <h2>Right-click each image and "Save image as" to the icons folder</h2>
  <p>Save as: icon16.png</p>
  <canvas id="icon16" width="16" height="16"></canvas>
  <br><br>
  <p>Save as: icon48.png</p>
  <canvas id="icon48" width="48" height="48"></canvas>
  <br><br>
  <p>Save as: icon128.png</p>
  <canvas id="icon128" width="128" height="128"></canvas>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const r = size * 0.18; // corner radius

      // Red rounded square background (#c0392b)
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = '#c0392b';
      ctx.fill();

      // Draw headphones in black
      const cx = size / 2;
      const cy = size / 2;
      const headR = size * 0.3;
      const bandWidth = size * 0.06;
      const earW = size * 0.14;
      const earH = size * 0.22;

      ctx.strokeStyle = '#000000';
      ctx.fillStyle = '#000000';
      ctx.lineWidth = bandWidth;
      ctx.lineCap = 'round';

      // Headband arc
      ctx.beginPath();
      ctx.arc(cx, cy - size * 0.02, headR, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();

      // Left ear cup (rounded rect)
      const leftX = cx - headR * Math.cos(Math.PI * 0.1) - earW / 2;
      const leftY = cy - size * 0.02 + headR * Math.sin(Math.PI * 0.1) - earH * 0.15;
      drawRoundedRect(ctx, leftX, leftY, earW, earH, size * 0.04);

      // Right ear cup (rounded rect)
      const rightX = cx + headR * Math.cos(Math.PI * 0.1) - earW / 2;
      const rightY = cy - size * 0.02 + headR * Math.sin(Math.PI * 0.1) - earH * 0.15;
      drawRoundedRect(ctx, rightX, rightY, earW, earH, size * 0.04);
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    drawIcon('icon16', 16);
    drawIcon('icon48', 48);
    drawIcon('icon128', 128);
  </script>
</body>
</html>
